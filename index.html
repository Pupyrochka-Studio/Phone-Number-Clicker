<style>
:root{--bg:#dde5ee;--sf:#f7f9fc;--ink:#101826;--mute:#5d6b80;--ac:#1f5eff;--acink:#fff;--money:#0a7a4b;--line:#c3cedb;--r0:#6b7788;--r1:#1f8fd6;--r2:#8a3fe0;--r3:#e08a00;--r4:#e0115f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1420;--sf:#172131;--ink:#e8eef7;--mute:#92a1b8;--ac:#6c93ff;--acink:#0d1420;--money:#4fd18b;--line:#2a3850;--r0:#9aa6b8;--r1:#4db3f5;--r2:#b583ff;--r3:#ffb02e;--r4:#ff5c9a}}
:root[data-theme="dark"]{--bg:#0d1420;--sf:#172131;--ink:#e8eef7;--mute:#92a1b8;--ac:#6c93ff;--acink:#0d1420;--money:#4fd18b;--line:#2a3850;--r0:#9aa6b8;--r1:#4db3f5;--r2:#b583ff;--r3:#ffb02e;--r4:#ff5c9a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Onest,system-ui,sans-serif}
.app{max-width:520px;margin:0 auto;padding:12px 14px 96px}
.top{display:flex;justify-content:space-between;align-items:flex-end;padding:8px 2px 14px}
.bal{font:700 34px/1 Unbounded,sans-serif;color:var(--money)}
.inc{color:var(--mute);font-size:14px;text-align:right}
.card{background:var(--sf);border:1.5px solid var(--line);border-radius:18px;padding:16px}
.sim{width:100%;display:block;text-align:center;border:2px solid var(--rc,var(--line));cursor:pointer;user-select:none;position:relative;overflow:hidden;padding:26px 14px 22px;color:var(--ink);font:inherit}
.sim:active{transform:scale(.985)}
.flag{font-size:56px;line-height:1}
.num{font:700 clamp(20px,6.4vw,28px)/1.2 Unbounded,sans-serif;margin:12px 0 6px;letter-spacing:-.5px}
.rar{font-weight:700;color:var(--rc)}
.hint{color:var(--mute);font-size:14px;margin-top:10px}
.btn{font:700 16px Onest,sans-serif;border:0;border-radius:14px;padding:14px 16px;background:var(--ac);color:var(--acink);width:100%;cursor:pointer;margin-top:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;margin:0}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.stats{display:flex;gap:10px;margin-top:12px}
.stats .card{flex:1;padding:10px 12px}
.stats b{display:block;font:700 18px Unbounded,sans-serif}
.stats span{color:var(--mute);font-size:13px}
.cases{display:grid;gap:12px}
.case{display:flex;gap:14px;align-items:center}
.case .ico{font-size:44px}
.case h3,.item h3{margin:0;font:700 16px Unbounded,sans-serif}
.odds{font-size:13px;color:var(--mute);margin-top:4px}
.case .info{flex:1;min-width:0}
.item{display:flex;gap:12px;align-items:center;margin-bottom:10px;border-left:6px solid var(--rc)}
.item .flag{font-size:34px}
.item .nm{font:700 15px Unbounded,sans-serif;word-break:break-word}
.item .meta{font-size:13px;color:var(--mute)}
.item .act{display:flex;flex-direction:column;gap:6px}
.item.on{background:color-mix(in srgb,var(--rc) 12%,var(--sf))}
h2{font:700 20px Unbounded,sans-serif;margin:4px 0 12px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1.5px solid var(--line);display:flex;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));gap:8px;z-index:5}
.tabs button{flex:1;border:0;background:transparent;color:var(--mute);font:700 14px Onest,sans-serif;padding:10px 4px;border-radius:12px;cursor:pointer}
.tabs button.on{background:var(--ac);color:var(--acink)}
.pop{position:fixed;pointer-events:none;font:700 20px Unbounded,sans-serif;color:var(--money);animation:up .8s ease-out forwards;z-index:9}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.ov{position:fixed;inset:0;background:rgba(5,10,20,.7);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.ov .card{width:100%;max-width:380px;text-align:center;border:2px solid var(--rc,var(--line))}
.spin{opacity:.75}
.toast{color:var(--mute);font-size:14px;margin-top:10px}
.case{border-left:6px solid var(--rc)}
.lim{border:2px solid var(--rc);animation:gl 2s infinite;text-align:center;margin-bottom:12px;background:color-mix(in srgb,var(--rc) 10%,var(--sf))}.lim .num{color:var(--rc)}
.sim.h2{animation:gl 2.4s infinite}.sim.h3{animation:gl 1.6s infinite}.sim.h4{animation:gl 1.2s infinite}
@keyframes gl{50%{box-shadow:0 0 28px var(--rc)}}
.sim.h3::after,.sim.h4::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(-100%);animation:sh 3s infinite}
@keyframes sh{to{transform:translateX(100%)}}
.bump{animation:bm .25s}@keyframes bm{50%{transform:scale(1.08)}}
.sim.lvl{animation:lv .6s}@keyframes lv{40%{transform:scale(1.04);box-shadow:0 0 30px var(--ac)}}
.pt{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:30;animation:bst .9s ease-out forwards}
@keyframes bst{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.flash{position:fixed;inset:0;z-index:25;pointer-events:none;background:radial-gradient(circle,var(--rc),transparent 65%);animation:fl .8s ease-out forwards}
@keyframes fl{from{opacity:.7}to{opacity:0}}
.pop3{animation:pp .5s cubic-bezier(.2,1.6,.4,1)}@keyframes pp{from{transform:scale(.5) rotate(-6deg);opacity:0}}
.glow{box-shadow:0 0 40px var(--rc)}
.shake{animation:pp .5s cubic-bezier(.2,1.6,.4,1),sk .5s .5s}@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.rw{position:relative;overflow:hidden;border-radius:12px;background:var(--bg);margin-top:10px}
.rs{display:flex;transition:transform 4.2s cubic-bezier(.12,.7,.1,1)}
.ri{width:116px;flex:none;text-align:center;padding:12px 4px 8px;border-bottom:4px solid var(--rc)}
.ri .flag{font-size:40px}.rn{font-size:12px;font-weight:700;color:var(--rc)}
.rm{position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--ac);transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){.rs{transition-duration:.01s}.pt,.flash,.pop3,.shake,.sim,.bump,.sim::after{animation:none}}
@media (prefers-reduced-motion:reduce){.pop{animation:none;opacity:0}}
.at{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;z-index:40;background:var(--sf);border:1.5px solid var(--ac);border-radius:14px;padding:10px 16px;font-weight:700;pointer-events:none;animation:at 3.2s ease forwards}@keyframes at{0%{transform:translate(-50%,-30px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,0);opacity:0}}
.rg{position:fixed;width:20px;height:20px;margin:-10px;border:3px solid;border-radius:50%;pointer-events:none;z-index:30;animation:rg .6s ease-out forwards}@keyframes rg{to{transform:scale(6);opacity:0}}
.cf{position:fixed;top:-30px;z-index:45;pointer-events:none;animation:cf linear forwards}@keyframes cf{to{transform:translate(var(--dx),110vh) rotate(540deg)}}
.qk .app{animation:qk .5s}@keyframes qk{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,3px)}}
